name: Fork APK Build

# Builds an installable debug APK for this fork and publishes it as a GitHub Release.
# The debug app installs as "com.nuviodebug.com", next to the official Nuvio app.
on:
  push:
    branches: ['more-profiles', 'seasonal-profiles']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build fullDebug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare runtime properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          touch local.properties
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            if printf '%s' "$LOCAL_PROPERTIES_BASE64" | tr -d ' \t\r\n' | base64 --decode > decoded.properties 2>/dev/null; then
              mv decoded.properties local.properties
              sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
            else
              rm -f decoded.properties
              echo "::warning::NUVIO_LOCAL_PROPERTIES_BASE64 is not valid base64 and was ignored."
            fi
          fi

      - name: Build fullDebug APK
        env:
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
        run: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace

      - name: Publish APK as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_NUMBER}"
          cp androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk "nuvio-${TAG}.apk"
          gh release create "$TAG" "nuvio-${TAG}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nuvio fork build #${GITHUB_RUN_NUMBER} (${GITHUB_REF_NAME})" \
            --notes "Debug APK built from ${GITHUB_REF_NAME} at ${GITHUB_SHA}. Seasonal profile screen. Installs as a separate app next to the official Nuvio." \
            --prerelease
